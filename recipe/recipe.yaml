schema_version: 1

context:
  version: "0.29.0"
  python_min: "3.10"

package:
  name: solvax
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/solvax/solvax-${{ version }}.tar.gz
  sha256: 28369e1f156b126dbefdeb78d3b968f726dc8190e5796b63ed1ecddf77e242bc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - jax >=0.4.38
    - equinox >=0.13.3
    - numpy >=1.24

tests:
  - python:
      imports:
        - solvax
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Differentiable structured linear solvers, preconditioners and matrix-free methods in JAX
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/uwplasma/SOLVAX
  repository: https://github.com/uwplasma/SOLVAX
  documentation: https://solvax.readthedocs.io

extra:
  recipe-maintainers:
    - rogeriojorge
    - matthewfeickert
