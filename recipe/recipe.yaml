schema_version: 1

context:
  version: "0.35.1"
  python_min: "3.10"

package:
  name: solvax
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/solvax/solvax-${{ version }}.tar.gz
  sha256: b6e27989ea5cbfaa2790da634134ab2dfebf0ba7f9c2ca13023835bb31deb7ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - jax >=0.4.38
    - equinox >=0.13.3
    - numpy >=1.24

tests:
  - python:
      imports:
        - solvax
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Differentiable structured linear solvers, preconditioners and matrix-free methods in JAX
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/uwplasma/SOLVAX
  repository: https://github.com/uwplasma/SOLVAX
  documentation: https://solvax.readthedocs.io

extra:
  recipe-maintainers:
    - rogeriojorge
    - matthewfeickert
